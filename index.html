<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akanksha Padule | Portfolio</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(5, 5, 39);
            color: white;
            font-family: "Poppins", sans-serif;
        }

        /* NAVBAR */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            height: 60px;
            background-color: rgb(16, 16, 95);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            display: flex;
        }

        nav ul li {
            list-style: none;
            margin: 0 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 0.95rem;
        }

        nav ul li a:hover {
            color: rgb(90, 90, 185);
        }

        .left {
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* SECTIONS */
        section {
            padding: 70px 80px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: rgb(90, 90, 185);
        }

        /* HERO SECTION */
        .firstsection {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 40px;
        }

        .leftsection {
            width: 45%;
            font-size: 1.6rem;
        }

        .welcome-text {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #cfd2ff;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1rem;
            color: #cfd2ff;
            margin: 10px 0 20px;
        }

        .rightsection img {
            width: 300px;
            border-radius: 50%;
            border: 4px solid rgb(90, 90, 185);
        }

        .purple {
            color: rgb(90, 90, 185);
        }

        #element {
            color: rgb(90, 90, 185);
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }

        /* BUTTONS */
        .btn-container {
            margin: 25px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .resume-btn {
            padding: 12px 25px;
            background-color: rgb(90, 90, 185);
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 30px;
            transition: 0.3s;
        }

        .resume-btn:hover {
            background-color: white;
            color: rgb(90, 90, 185);
            transform: scale(1.05);
        }

        .linkedin-btn {
            padding: 12px 25px;
            background-color: transparent;
            color: rgb(90, 90, 185);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 30px;
            border: 2px solid rgb(90, 90, 185);
            transition: 0.3s;
        }

        .linkedin-btn:hover {
            background-color: rgb(90, 90, 185);
            color: white;
            transform: scale(1.05);
        }

        /* ABOUT */
        .about p {
            max-width: 900px;
            line-height: 1.8;
            font-size: 1rem;
        }

        /* SKILLS */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .skill-box {
            background-color: rgb(16, 16, 95);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .skill-box h3 {
            color: rgb(90, 90, 185);
            margin-bottom: 10px;
        }

        .skill-box ul {
            list-style: none;
            padding: 0;
        }

        .skill-box ul li {
            display: inline-block;
            background-color: rgba(90, 90, 185, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            margin: 6px;
            font-size: 0.9rem;
        }

        /* PROJECTS */
        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .project-card {
            background-color: rgb(16, 16, 95);
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .project-card h3 {
            color: rgb(90, 90, 185);
            margin-bottom: 10px;
        }

        /* SERVICES */
        .services-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .service-box {
            background-color: rgb(16, 16, 95);
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        /* CONTACT */
        .contact p {
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .contact i {
            margin-right: 10px;
            color: rgb(90, 90, 185);
        }

        .social-link {
            color: rgb(90, 90, 185);
            text-decoration: none;
            font-weight: 500;
        }

        .social-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: rgb(16, 16, 95);
            font-size: 0.9rem;
        }
    </style>
</head>
